{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym Management</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700,800,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/gym-theme.css' %}">
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 2.5rem;
        }
        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
        }
        .password-toggle:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="form-page">
        <div class="form-container">
            <h2>Login</h2>
            <p class="subtitle">Sign in to your account. Admin users will be redirected to the dashboard.</p>

            {% if error == "yes" %}
                <div id="error-alert" class="alert alert-danger" style="display:none;">Invalid Credentials, Please Try Again</div>
            {% endif %}

            <form method="post" id="loginForm">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="form-submit">Login</button>
            </form>
            <div class="form-links">
                Don't have an account? <a href="{% url 'gym:register' %}">Register here</a>
            </div>
            <div class="form-links">
                <a href="{% url 'gym:index' %}">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        {% if error == "yes" %}
            var alertBox = document.getElementById('error-alert');
            alertBox.style.display = 'block';
            alertBox.scrollIntoView({ behavior: 'smooth' });
        {% endif %}

        function togglePassword() {
            var password = document.getElementById('password');
            var icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
