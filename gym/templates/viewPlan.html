{% extends 'admin_nav.html' %}
{% load static %}

{% block content %}
<div class="dashboard">
    <div class="table-container">
        <div class="table-header">
            <h3>View <span>Plan</span></h3>
        </div>
        <table id="example" class="gym-table">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Plan Name</th>
                    <th>Amount</th>
                    <th>Duration (Months)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for i in plan %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ i.name }}</td>
                    <td>{{ i.amount }}</td>
                    <td>{{ i.duration }}</td>
                    <td>
                        <a href="{% url 'gym:edit_Plan' i.id %}" class="btn-sm btn-edit">Edit</a>
                        <form method="post" action="{% url 'gym:delete_Plan' i.id %}" style="display:inline;" onsubmit="return confirm('Are you sure to delete this Plan?')">
                            {% csrf_token %}
                            <button type="submit" class="btn-sm btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
