services:
  - type: web
    name: gym-management-system
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn GymManagementDjango.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "gym-management-system-wfta.onrender.com"
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        value: "postgres"
      - key: DB_PASSWORD
        value: "ShivamChoudhary4094"
      - key: DB_HOST
        value: "db.uecrpglevxxhcjvwiwlc.supabase.co"
      - key: DB_PORT
        value: "5432"
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
    healthCheckPath: /health/
